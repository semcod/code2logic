version: '3.8'

services:
  code2logic:
    build: .
    volumes:
      - ./:/project:ro
      - ./output:/output
    command: ["/project", "-f", "csv", "-d", "standard", "-o", "/output/analysis.csv"]

  # Development container with all tools
  code2logic-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app
      - ./output:/output
    working_dir: /app
    command: ["bash"]
    stdin_open: true
    tty: true


volumes:
  ollama_data: